# 构建禁漫天堂这一个扩展，签名并发布到本仓库的 repo 分支。
#
# 本文件是**构建与发布的唯一入口**（单一事实来源）：
#   - push 到 src/zh/jinmantiantang/** 等路径 → 构建 → 发布
#   - Actions 手动 workflow_dispatch        → 构建 → 发布（手动重发走这里）
#   - sync-upstream.yml 每日 rebase 后推送 personal，同样走这条 push 链路
# 因此"改了代码 push 完却收不到更新"不会再发生。
#
# 与上游 build_push.yml 的区别（详细设计记录在本地工作区 docs/，不入 Git）：
#   1. 上游的 upload-artifact / publish 都带 `github.repository == 'keiyoushi/extensions-source'`
#      守卫，在 fork 上会被跳过，下载不到产物。此处不加守卫。
#   2. 若已配置签名 secret（SIGNING_KEY 等），用其签名并产出稳定的 release 包；
#      未配置则回落 debug 签名（每次构建的签名都可能不同，不适合自动更新）。
#      上游的「Prepare signing key」在无 secret 时会产生空 keystore 导致构建失败，故此处
#      用 HAS_SIGNING_KEY 条件守卫，而不是无条件创建文件。
#   3. 不走全量矩阵。上游首次运行会因缺少历史成功记录而回退到空树 SHA，导致 1384 个模块
#      全部重建；此处只建单模块。
#   4. 不提供 workflow_call：sync-upstream 只推 personal，构建由那次 push 触发。
#      否则同一次同步会出现两条构建（push + workflow_call）抢同一个 concurrency 组、
#      互相取消，还会把父 sync run 显示成 cancelled。
#   5. 版本号完全跟随上游 Jinmantiantang 模块：
#      a) verify-login.py —— 校验登录功能是否仍完整插桩；
#      b) verify-upstream-version.py module —— 构建前要求 personal 模块的 versionCode /
#         libVersion 与 origin/main（官方镜像）完全一致，不允许个人提交改版本号；
#      c) verify-upstream-version.py artifact —— 构建后要求产物版本与同一上游值一致。
#   6. 不再执行“已发布值 + 1”。上游版本未变时：
#      - 内容变化：发布同一版本，供手动安装；
#      - 内容未变：跳过发布。
#   7. 上游版本升级时自然产生更大的 versionCode，Mihon 可识别为自动更新。
#   8. 一次性版本回退只允许手动 workflow_dispatch 勾选 allow_version_reset。
#   9. 发布前要求签名 secret 存在：debug 签名与已安装 release 签名不一致时，Mihon 会拒绝更新。
#  10. 内容判据 fail-open；版本一致性和签名检查 fail-closed。
#  11. 发布记录里的官方基线 SHA 由 Deploy 前的一步从 origin/main 读取（origin/main 即官方镜像，
#      sync-upstream 会先推它），不再依赖调用方传入；读不到只警告、不阻断发布。
#
# 注意：GitHub Actions 会设置 CI=true，届时 preBuild 依赖的是 spotlessCheck（严格校验）
# 而非本地的 spotlessApply，因此代码风格不合规会直接导致构建失败。

name: Build jinmantiantang

on:
  push:
    branches:
      - personal
    paths:
      - '.github/workflows/build-jinmantiantang.yml'
      - '.github/scripts/**'
      - 'src/zh/jinmantiantang/**'
      - 'core/**'
      - 'compiler/**'
      - 'common/**'
      - 'lib/randomua/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
  workflow_dispatch:
    inputs:
      skip_publish:
        description: '只构建并上传产物，不发布到 repo 分支（调试用）'
        type: boolean
        default: false
      allow_version_reset:
        description: '一次性允许发布低于线上 versionCode 的上游精确版本'
        type: boolean
        default: false

permissions:
  contents: write

env:
  HAS_SIGNING_KEY: ${{ secrets.SIGNING_KEY != '' }}

concurrency:
  group: build-jinmantiantang
  cancel-in-progress: true

jobs:
  build:
    name: Build :src:zh:jinmantiantang
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      # 证书 SHA-256 指纹，供发布流水线写入扩展仓库索引的 signingKey 字段
      signing_fingerprint: ${{ steps.fingerprint.outputs.fingerprint }}
      expected_version_code: ${{ steps.upstream_version.outputs.expected_version_code }}
      expected_version_name: ${{ steps.upstream_version.outputs.expected_version_name }}
      expected_lib_version: ${{ steps.upstream_version.outputs.expected_lib_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: personal
          persist-credentials: false

      # 关卡①：fork 自己加的登录功能是否还完整挂在扩展上（失败即中止，不构建不发布）
      - name: Verify login feature intact
        run: python3 .github/scripts/verify-login.py

      # 关卡②：模块版本必须与官方 main 完全一致；personal 只允许有功能补丁。
      - name: Fetch official main version source
        run: git fetch origin main --no-tags --depth=1

      - name: Verify module version matches upstream
        id: upstream_version
        run: python3 .github/scripts/verify-upstream-version.py module --ref origin/main

      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # 仅在配置了签名 secret 时才创建 keystore；否则回落 debug 签名。
      # 切勿在无 secret 时无条件创建文件——空的 keystore 会让构建在签名阶段失败。
      - name: Prepare signing key
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: echo "$SIGNING_KEY" | base64 -d > signingkey.jks

      - name: Compute signing fingerprint
        if: env.HAS_SIGNING_KEY == 'true'
        id: fingerprint
        env:
          ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
        run: |
          FP=$(keytool -exportcert -keystore signingkey.jks -alias "$ALIAS" \
               -storepass "$KEY_STORE_PASSWORD" 2>/dev/null \
               | sha256sum | cut -d' ' -f1)
          echo "fingerprint=$FP" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew :src:zh:jinmantiantang:assembleRelease 2>&1 | tee "$RUNNER_TEMP/build.log"

      # 构建失败时把错误摘要同时写进 job summary 与检查注解。
      # 注解可通过公开 API（/check-runs/{id}/annotations）读取，因此无需仓库管理权限
      # 也能定位失败原因。
      - name: Report build failure
        if: failure()
        run: |
          EXCERPT=$(grep -nE "FAILURE:|^e: |error:|What went wrong|Execution failed|> Task .* FAILED|Caused by|^\* Where:" "$RUNNER_TEMP/build.log" | tail -20 | tr '\n' '%0A' | head -c 60000)
          echo "::error title=Gradle assembleRelease failed::$EXCERPT"
          {
            echo "## ❌ assembleRelease 失败"
            echo ""
            echo '```text'
            tail -120 "$RUNNER_TEMP/build.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jinmantiantang
          path: |
            src/zh/jinmantiantang/build/outputs/apk/release/*.apk
            src/zh/jinmantiantang/build/outputs/jar/release/*.jar
            src/zh/jinmantiantang/build/keiyoushi-source-info.json
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish to repo branch
    needs: build
    # 手动 workflow_dispatch 可勾 skip_publish 只出产物；push 场景下 inputs 为空，条件为真，照常发布。
    if: inputs.skip_publish != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SIGNING_KEY_FP: ${{ needs.build.outputs.signing_fingerprint }}
    steps:
      # 签名缺失时拒绝发布（取舍见文件头第 9 点）：repo 分支保持上一个可用版本，
      # 比发一个签名不匹配、用户装不上的包要好。
      - name: Require signing key
        run: |
          if [ -z "$SIGNING_KEY_FP" ]; then
            echo "::error title=签名 secret 缺失，拒绝发布::没拿到签名指纹，说明 SIGNING_KEY / ALIAS / KEY_STORE_PASSWORD / KEY_PASSWORD 至少有一个没配好。debug 签名的包会让已安装用户无法更新，因此本次不发布。"
            exit 1
          fi
          echo "签名指纹：$SIGNING_KEY_FP"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: jinmantiantang
          path: artifacts

      # 发布记录里的官方基线 SHA：origin/main 就是官方镜像（sync-upstream 先推它，
      # 手工同步时同样先推 main）。取不到只警告——溯源信息缺失不该阻断发布。
      - name: Resolve upstream base
        id: upstream
        run: |
          git fetch origin main --depth=1 --no-tags || true
          SHA=$(git rev-parse origin/main 2>/dev/null || echo "")
          if [ -z "$SHA" ]; then
            echo "::warning title=无法确定官方基线 commit::origin/main 不可用，本次发布记录的 upstream= 字段将为空。"
          else
            echo "官方基线（origin/main）：$SHA"
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      # 关卡③：内容判据。Mihon 只比较 versionCode（不比较内容），"内容没变却发布"会让用户
      # 收到一次什么都没改的更新提示，并白耗一个版本号。这里对 JAR 做版本无关的规范化哈希，
      # 与线上已发布的那份比对；一致就跳过发布会。该脚本 fail-open，任何异常都按"内容已变"
      # 处理，绝不会卡住发布。
      - name: Check content changed
        id: content
        run: python3 .github/scripts/check-content-changed.py --artifact artifacts

      # 关卡③：产物版本必须等于 origin/main 中 Jinmantiantang 的模块版本。
      - name: Verify artifact version matches upstream
        id: version
        env:
          EXPECTED_VERSION_CODE: ${{ needs.build.outputs.expected_version_code }}
          EXPECTED_VERSION_NAME: ${{ needs.build.outputs.expected_version_name }}
          EXPECTED_LIB_VERSION: ${{ needs.build.outputs.expected_lib_version }}
        run: |
          ARGS=(
            artifact
            --artifact artifacts
            --expected-version-code "$EXPECTED_VERSION_CODE"
            --expected-version-name "$EXPECTED_VERSION_NAME"
            --expected-lib-version "$EXPECTED_LIB_VERSION"
          )
          if [ "${{ inputs.allow_version_reset }}" = "true" ]; then
            ARGS+=(--allow-version-reset)
          fi
          python3 .github/scripts/verify-upstream-version.py "${ARGS[@]}"

      # 发布条件只看两件事：内容是否变化、上游版本号是否变化。
      # 同版本的个人改动允许发布到 repo，但只能手动安装；版本升级则可由 Mihon 自动更新。
      - name: Decide publish
        id: publish
        run: |
          if [ "${{ steps.content.outputs.changed }}" = "true" ] || [ "${{ steps.version.outputs.version_changed }}" = "true" ]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          fi

          if [ "${{ steps.version.outputs.version_reset }}" = "true" ]; then
            echo "::warning title=已授权一次性版本回退::repo 分支将切换到上游精确版本，客户端需卸载后手动安装。"
          fi
          if [ "${{ steps.content.outputs.changed }}" = "true" ] && [ "${{ steps.version.outputs.version_changed }}" != "true" ]; then
            echo "::warning title=同版本内容更新::版本号未变化，Mihon 不会自动提示更新，需要手动安装。"
          fi

      - name: Notice skipped publish
        if: steps.publish.outputs.should_publish != 'true'
        run: |
          echo "::notice title=内容与版本均未变，跳过发布::线上仍为 v${{ steps.content.outputs.version_name }}（versionCode ${{ steps.content.outputs.version_code }}）。"

      # 版本必须与 index_pb2.py 的 gencode 完全一致：该文件由 protoc 生成，导入时会做
      # ValidateProtobufRuntimeVersion 校验。用 `pip install -U protobuf` 拉到更新版本会
      # 在某个随机夜晚直接失败。升级时请同步重新生成 gencode 并同时改这里。
      - name: Install protobuf runtime
        if: steps.publish.outputs.should_publish == 'true'
        run: pip install 'protobuf==7.35.1'

      - name: Generate index
        id: genindex
        if: steps.publish.outputs.should_publish == 'true'
        continue-on-error: true
        run: |
          set -o pipefail
          python3 .github/scripts/publish-single.py \
            'src/zh/jinmantiantang' \
            'artifacts' 2>&1 | tee "$RUNNER_TEMP/publish.log"

      # 把失败摘要写进检查注解与 job summary，便于用公开 API 读取
      - name: Report publish failure
        if: steps.genindex.outcome == 'failure'
        run: |
          EXCERPT=$(tail -40 "$RUNNER_TEMP/publish.log" | tr '\n' '%0A' | head -c 60000)
          echo "::error title=Generate index failed::$EXCERPT"
          {
            echo "## ❌ 生成索引失败"
            echo ""
            echo '```text'
            cat "$RUNNER_TEMP/publish.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Deploy to repo branch
        if: steps.publish.outputs.should_publish == 'true'
        env:
          VERSION_NAME: ${{ steps.version.outputs.built_version_name }}
          VERSION_CODE: ${{ steps.version.outputs.built_version_code }}
          UPSTREAM_BASE: ${{ steps.upstream.outputs.sha }}
        run: |
          SOURCE_SHA=$(git rev-parse --short HEAD)
          UPSTREAM_LABEL=""
          if [ -n "${UPSTREAM_BASE:-}" ]; then
            UPSTREAM_LABEL=" upstream=${UPSTREAM_BASE:0:12}"
          fi
          cd repo-out
          git init -q -b repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git add -A
          # 提交信息带上版本号与来源提交，便于回溯"某个版本对应哪次提交"
          git commit -q -m "Publish v${VERSION_NAME} (versionCode ${VERSION_CODE}) from ${SOURCE_SHA}${UPSTREAM_LABEL}"
          git push -q -f origin repo
          echo "✅ 已发布到 repo 分支：v${VERSION_NAME}（versionCode ${VERSION_CODE}）"
          echo "仓库地址（添加到 Mihon 的扩展仓库）："
          echo "https://raw.githubusercontent.com/${{ github.repository }}/repo/index.min.json"
