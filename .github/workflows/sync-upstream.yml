# 定时同步上游 keiyoushi/extensions-source，合并后自动构建并发布到本仓库的
# `repo` 分支。Mihon 添加
#   https://raw.githubusercontent.com/jldxnb/extensions-source/repo/index.min.json
# 即可自动收到更新，无需手动下载 APK。
#
# 设计要点（详见 docs/jinmantiantang/12-development-log.md §18.10）：
#   1. 合并冲突只自动解决两类：
#      a) src/zh/jinmantiantang/build.gradle.kts 的 versionCode —— 取上游值 + 1
#         注意：这一条只是兜底。fork 不再提交自己的 versionCode 改动（改由
#         ensure-version-bump.py 在构建时按"已发布值 + 1"计算），所以正常情况不会冲突；
#         即便如此也不能只取上游 + 1，最终以构建产物的真实 versionCode 为准（见下第 3 点）。
#      b) 我们刻意删除的上游 workflow 文件 —— 保持删除
#      其余冲突：放弃合并并以错误注解提示（此时上一版扩展仍可正常使用）
#   2. 合并后的 push 使用 GITHUB_TOKEN，不会触发其他 workflow，
#      因此构建由本文件通过 workflow_call 直接复用 build-jinmantiantang.yml。
#   3. **发布不由本文件负责**：构建与发布都在 build-jinmantiantang.yml 内完成
#      （构建即发布）。本文件只负责"合并上游 → 触发构建"。若在两边都实现发布，
#      夜间会发布两次、两个 job 抢着推 repo 分支。
#   4. 构建前会校验登录功能锚点是否完整、有效 versionCode 是否大于已发布值；
#      发布前要求签名 secret 存在（缺失则拒绝发布，见 build-jinmantiantang.yml 文件头）。
#      任一关卡不过 → 不构建/不发布，repo 分支保持上一个可用版本。

name: Sync upstream

on:
  schedule:
    - cron: '30 18 * * *' # 每天一次（UTC 18:30 = 北京 02:30）
  workflow_dispatch:
    inputs:
      force_publish:
        description: '跳过上游同步，强制构建并发布（测试 / 手动重发）'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    name: Merge upstream
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      merged: ${{ steps.merge.outputs.merged || steps.force.outputs.forced }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # 合并需要共同祖先
          persist-credentials: true # 合并后要推送

      # 手动触发且勾选 force_publish 时：跳过同步，直接构建并重新发布
      - name: Force publish
        if: inputs.force_publish == true
        id: force
        run: echo "forced=true" >> "$GITHUB_OUTPUT"

      - name: Merge upstream
        id: merge
        if: inputs.force_publish != true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/keiyoushi/extensions-source.git
          git fetch upstream main --no-tags

          BASE=$(git merge-base HEAD upstream/main || true)
          if [ -n "$BASE" ] && [ "$BASE" = "$(git rev-parse upstream/main)" ]; then
            echo "已与上游同步，无需合并"
            echo "merged=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git merge upstream/main --no-edit; then
            echo "merged=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CONFLICTS=$(git diff --name-only --diff-filter=U)
          echo "冲突文件："
          echo "$CONFLICTS"

          # 自动解决 ①：versionCode 取上游值 + 1
          if echo "$CONFLICTS" | grep -q "src/zh/jinmantiantang/build.gradle.kts"; then
            git checkout --theirs src/zh/jinmantiantang/build.gradle.kts
            VC=$(grep -oE 'versionCode = [0-9]+' src/zh/jinmantiantang/build.gradle.kts | grep -oE '[0-9]+')
            sed -i "s/versionCode = ${VC}/versionCode = $((VC + 1))/" src/zh/jinmantiantang/build.gradle.kts
            git add src/zh/jinmantiantang/build.gradle.kts
          fi

          # 自动解决 ②：我们刻意删除的上游 workflow 保持删除
          for f in build_push.yml codeberg_mirror.yml build_pull_request.yml \
                   cleanup_releases.yml issue_moderator.yml lock.yml; do
            if git diff --name-only --diff-filter=U | grep -q ".github/workflows/$f"; then
              git rm -q ".github/workflows/$f"
            fi
          done

          if git diff --name-only --diff-filter=U | grep -q .; then
            git diff --name-only --diff-filter=U | tee "$GITHUB_STEP_SUMMARY"
            git merge --abort
            echo "::error title=合并冲突::存在无法自动解决的冲突，需要人工按 docs §18.7 SOP 处理"
            exit 1
          fi

          git commit --no-edit
          echo "merged=true" >> "$GITHUB_OUTPUT"

      - name: Push
        if: steps.merge.outputs.merged == 'true'
        run: git push origin main

  build:
    name: Build
    needs: sync
    if: needs.sync.outputs.merged == 'true'
    uses: ./.github/workflows/build-jinmantiantang.yml
    secrets: inherit

  # 发布动作不在这里 —— 已统一到 build-jinmantiantang.yml（构建即发布）。
  # 见文件头第 3 点：两边都实现会导致夜间重复发布、两个 job 抢推 repo 分支。
