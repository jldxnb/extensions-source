# 同步官方 main，并把 personal 的个人提交重新接到最新 main 上。
#
# 分支模型（长期约束）：
#   main     = keiyoushi/extensions-source/main 的镜像，不含个人功能
#   personal = main + 本项目自己的修改，是默认构建与发布分支
#
# 版本策略：rebase 成功后 personal 自动继承 upstream 的 Jinmantiantang
# `versionCode` 与 `libVersion`；build workflow 只校验二者一致，不再自动加版本。
#
# 本 workflow 不自动“猜”冲突结果：rebase 一旦冲突立即中止并报告，
# 避免把半应用的个人修改静默构建成错误 APK。
#
# 本 workflow 也**不构建、不发布**，只更新 main 与 personal：
#   push personal 用的 SYNC_TOKEN 是 PAT，会正常触发 workflow，
#   因此构建交给 build-jinmantiantang.yml 的 push 触发；发布记录里的官方基线 SHA
#   由它自己从 origin/main 读取（origin/main 就是官方镜像）。
#   历史做法是在这里再 workflow_call 一次构建，结果是同一次同步出现两条构建
#   （push 一条、workflow_call 一条），两者抢同一个 concurrency 组互相取消，
#   还会把父 sync run 一起显示成 cancelled。去掉后每晚只有一条构建，状态也不再误导。
#   附带好处：上游只改了与本模块无关的路径时，push 的 paths 过滤不命中，连构建都不会起
#   ——那种情况产物本来也不可能变，关卡③同样会跳过发布。
#
# 前置条件：默认分支必须设为 personal，schedule 事件才会从本文件触发。
# 权限：本 job 需要 secret SYNC_TOKEN（Contents write + Workflows write）。
# 默认 GITHUB_TOKEN 不能更新 .github/workflows/**，因此不能用于这个同步 job。
# 远端迁移已一次性完成；本 workflow 只维护 main 与 personal 的同步关系。
name: Sync upstream

on:
  schedule:
    - cron: '30 18 * * *' # UTC 18:30 = 北京 02:30
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    name: Sync main and rebase personal
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout personal
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: personal
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.SYNC_TOKEN }}

      - name: Sync main and rebase personal
        id: sync
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/keiyoushi/extensions-source.git
          git fetch upstream main --no-tags
          UPSTREAM_SHA=$(git rev-parse upstream/main)
          echo "官方 main: $UPSTREAM_SHA"

          git fetch origin main --no-tags
          git switch -C main origin/main

          if ! git merge --ff-only upstream/main; then
            echo "::error title=main 不是官方纯镜像::origin/main 与 upstream/main 不是 fast-forward 关系。请先完成一次性分支迁移，再启用定时同步。"
            exit 1
          fi
          git push origin main

          git switch personal
          BEFORE=$(git rev-parse HEAD)
          if ! git rebase main; then
            git diff --name-only --diff-filter=U | tee "$GITHUB_STEP_SUMMARY" || true
            git rebase --abort || true
            echo "::error title=personal rebase 冲突::官方改动与个人修改发生真实冲突。已中止 rebase；personal 与 repo 分支保持原样，请人工处理。"
            exit 1
          fi
          AFTER=$(git rev-parse HEAD)

          if [ "$BEFORE" = "$AFTER" ]; then
            echo "personal 已基于当前 main，无需重建（不触发构建）"
          else
            git push --force-with-lease origin personal
            echo "personal 已 rebase 并推送: $BEFORE -> $AFTER"
            echo "本次 push 触发 Build jinmantiantang；官方基线 $UPSTREAM_SHA 由它从 origin/main 记录"
          fi
